<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>まとめたやーつ</title>
<style>
  :root { --ink: #0a0c18; --bg: #12141f; --card: #1d2136; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #fff; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 22px) 12px calc(env(safe-area-inset-bottom) + 40px); }
  header { text-align: center; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 38px; font-weight: 900; letter-spacing: 1px; line-height: 1.15; }
  h1 span { display: inline-block; text-shadow: 0 3px 0 var(--ink); }
  .lead { font-size: 13px; opacity: .8; margin: 8px 0 0; line-height: 1.6; }
  #random { display: block; width: 100%; margin: 16px 0 6px; padding: 14px; border: 3px solid #fff; border-radius: 16px;
    background: #ff5d73; color: #fff; font: inherit; font-size: 19px; font-weight: 900; box-shadow: 0 5px 0 var(--ink); }
  #random:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  #stat { text-align: center; font-size: 12px; opacity: .75; margin: 10px 0 14px; min-height: 1em; }
  #grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  a.card { display: block; text-decoration: none; color: inherit; background: var(--card); border: 3px solid var(--ink);
    border-radius: 16px; overflow: hidden; box-shadow: 0 4px 0 var(--ink); position: relative; }
  a.card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .card img { display: block; width: 100%; aspect-ratio: 3 / 3.4; object-fit: cover; object-position: center 35%; background: #262b47; }
  .card .genre { position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 700; background: rgba(10,12,24,.85);
    border-radius: 99px; padding: 3px 9px; }
  .card .best { position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 900; color: var(--ink); background: #ffd23e;
    border-radius: 99px; padding: 3px 8px; }
  .card .body { padding: 9px 10px 11px; border-top: 4px solid var(--c); }
  .card b { display: block; font-size: 19px; font-weight: 900; color: var(--c); }
  .card p { margin: 3px 0 0; font-size: 12px; line-height: 1.5; opacity: .88; }
  h2 { font-size: 15px; margin: 26px 2px 8px; opacity: .85; }
  a.wide { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; background: #f2efe6; color: var(--ink);
    border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px; box-shadow: 0 4px 0 #000; font-family: ui-monospace, Menlo, monospace; }
  a.wide b { font-size: 17px; display: block; } a.wide span { font-size: 12px; }
  a.wide i { margin-left: auto; font-style: normal; font-size: 24px; }
  footer { font-size: 11px; opacity: .55; margin-top: 22px; line-height: 1.7; text-align: center; }
  footer a { color: #8fd8ff; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="logo">まとめたやーつ</h1>
    <p class="lead">縦画面・片手で遊べるミニゲームのまとめ。<br>どれもタップ 1 回で始まって、すぐやり直せます。</p>
  </header>
  <button id="random">🎲 おまかせで遊ぶ</button>
  <div id="stat"></div>
  <div id="grid"></div>
  <h2>ほかの作品</h2>
  <a class="wide" href="../index.html"><div><b>ENDLESS STAIR</b><span>白黒ドットの階段を、拍に合わせて登るリズムゲーム</span></div><i>›</i></a>
  <footer>絵と音は仮のものです（図形と合成音）。<br>設計の点検に <a href="https://github.com/kociden/sakurai-skill">sakurai-skill</a>（非公式のまとめ）を参照。</footer>
</main>
<script>
  const LIST = [
    ['nikuhaku', 'ニクハク', 'シューティング', '#ffd23e', '近づくほど弾が強い。でも近いほどあぶない。', ''],
    ['tsunagi', 'ツナギ', 'パズル', '#3ec1ff', '同じ色をなぞって消す。長いほど高得点。', ''],
    ['gakepita', 'ガケピタ', 'はじき', '#ff5d73', '崖のギリギリで止めろ。行きすぎたら落ちる。', ''],
    ['kabekick', 'カベキック', 'アクション', '#6fe36a', '壁から壁へキック。下から溶岩がせまる。', 'm'],
    ['jintori', 'ジントリ', 'ストラテジー', '#3ec1ff', '兵を送って陣地を広げ、赤をぜんぶ取る。', ''],
    ['pikapika', 'ピカピカ', '作業・育成', '#ffe15a', '窓をこすって稼ぎ、道具を買ってもっと磨く。', 'まい'],
    ['yokubari', 'ヨクバリ', '運だめし', '#ffd23e', 'もぐるほど宝は増える。サメに会ったら空っぽ。', ''],
    ['kakkin', 'カッキーン', 'スポーツ', '#ffd23e', 'タイミングよく打つ。フルスイングは一発狙い。', 'm'],
    ['suberu', 'スベール', 'すべるパズル', '#8fd8ff', '止まれないペンギンを、魚まで届ける。', '問'],
    ['shiwake', 'シワケ', '反射', '#ff5d73', '左右にすばやく仕分け。急ぐほどコンボ。', ''],
  ];
  const COLORS = ['#ff5d73', '#ffd23e', '#6fe36a', '#3ec1ff', '#c084fc'];
  const logo = document.getElementById('logo');
  logo.innerHTML = [...logo.textContent].map((ch, i) => `<span style="color:${COLORS[i % COLORS.length]};transform:rotate(${(i % 2 ? 4 : -4)}deg)">${ch}</span>`).join('');
  let played = 0;
  document.getElementById('grid').innerHTML = LIST.map(([id, t, g, c, d, unit]) => {
    let best = 0; try { best = +(localStorage.getItem('mock_' + id) || 0); } catch (e) { }
    if (best) played++;
    return `<a class="card" style="--c:${c}" href="play.html?g=${id}">
      <img src="thumbs/${id}.jpg" alt="${t} のゲーム画面" loading="lazy">
      <span class="genre">${g}</span>${best ? `<span class="best">ベスト ${best}${unit}</span>` : ''}
      <div class="body"><b>${t}</b><p>${d}</p></div></a>`;
  }).join('');
  document.getElementById('stat').textContent = played ? `${LIST.length} 本中 ${played} 本プレイ済み` : `ぜんぶで ${LIST.length} 本`;
  document.getElementById('random').onclick = () => {
    let fresh = LIST.filter(([id]) => { try { return !localStorage.getItem('mock_' + id); } catch (e) { return true; } });
    if (!fresh.length) fresh = LIST; // まだ遊んでいないものを優先
    location.href = 'play.html?g=' + fresh[Math.floor(Math.random() * fresh.length)][0];
  };
</script>
</body>
</html>
