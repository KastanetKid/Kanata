<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>まとめたやーつ</title>
<style>
  html, body { margin: 0; height: 100%; background: #12141f; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center; height: 100dvh; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="lib.js"></script>
<script>
  // ?g=名前 で games/名前.js を読む（一覧にある名前だけ通す）
  const GAMES = ['nikuhaku', 'tsunagi', 'gakepita', 'kabekick', 'jintori', 'pikapika', 'yokubari', 'kakkin', 'suberu', 'shiwake'];
  const g = new URLSearchParams(location.search).get('g');
  if (GAMES.includes(g)) { const s = document.createElement('script'); s.src = 'games/' + g + '.js'; document.body.appendChild(s); }
  else location.replace('index.html');
</script>
</body>
</html>
