<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0d">
<title>Endless Stair</title>
<style>
  :root { --ink: #f2efe6; --bg: #0b0b0d; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    overflow: hidden; overscroll-behavior: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: fixed; inset: 0; width: 100vw; height: 100dvh;
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none; display: block;
  }
  #hud {
    position: fixed; top: calc(env(safe-area-inset-top) + 14px); right: 14px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    pointer-events: none;
  }
  #flag {
    background: var(--ink); color: var(--bg); font-weight: 700; font-size: 18px;
    padding: 3px 12px 3px 18px; min-width: 36px; text-align: right;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 10px 50%);
  }
  #energy { width: 72px; height: 4px; border: 1px solid var(--ink); }
  #energy > i { display: block; height: 100%; width: 100%; background: var(--ink); }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    pointer-events: none; text-shadow: 0 0 6px #000, 0 0 2px #000;
  }
  .overlay[hidden] { display: none; }
  .overlay > * { background: var(--bg); padding: 4px 10px; }
  .overlay h1 { margin: 0; font-size: 30px; letter-spacing: 4px; }
  .overlay p { margin: 0; font-size: 14px; line-height: 1.7; }
  .blink { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 22px);
    display: flex; justify-content: space-between; padding: 0 28px;
    font-size: 13px; opacity: .75; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="flag">0</div>
  <div id="energy"><i></i></div>
</div>

<div id="title" class="overlay">
  <h1>ENDLESS<br>STAIR</h1>
  <p>次の段がある側を<br>タップして登ろう</p>
  <p class="blink">TAP TO START</p>
</div>

<div id="over" class="overlay" hidden>
  <h1>FELL</h1>
  <p>SCORE <b id="finalScore">0</b><br>BEST <b id="bestScore">0</b></p>
  <p class="blink">TAP TO RETRY</p>
</div>

<div id="hint"><span>◀ 左上へ</span><span>右上へ ▶</span></div>

<script src="game.js"></script>
</body>
</html>
